const CONS={'க':'f','ங':'q','ச':'r','ஞ':'Q','ட':'l','ண':'z','த':'j','ந':'e','ப':'g','ம':'k','ய':'a','ர':'u','ல':'y','வ':'t','ழ':'o','ள':'s','ற':'w','ன':'d','ஜ':'[','ஷ':'\\','ஸ':']','ஹ':'^'};
